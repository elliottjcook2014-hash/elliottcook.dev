<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account</title>
</head>
<body>
    <h1>Account Profile</h1>
    
    <div id="profile-details">
        <p>Loading profile...</p>
    </div>

    <button id="logout-btn" onclick="logout()" style="display: none;">Log Out</button>

    <p id="status" role="status" aria-live="polite"></p>

    <script>
        const profileDetails = document.getElementById('profile-details');
        const logoutBtn = document.getElementById('logout-btn');
        const statusText = document.getElementById('status');

        async function loadProfile() {
            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/me', {
                    credentials: 'include',
                    method: 'GET',
                });

                if (response.ok) {
                    const result = await response.json();
                    const user = result.user;

                    profileDetails.innerHTML = `
                        <p><strong>First Name:</strong> ${user.firstName || 'N/A'}</p>
                        <p><strong>Username:</strong> ${user.username}</p>
                        <p><strong>User ID:</strong> ${user.id}</p>
                    `;
                    logoutBtn.style.display = 'inline-block';
                } else {
                    // Not logged in, redirect back to login page
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Could not load profile:', error);
                statusText.textContent = 'Failed to load profile details.';
            }
        }

        async function logout() {
            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/logout', {
                    method: 'POST',
                    credentials: 'include'
                });

                if (response.ok) {
                    // Redirect to login page after logging out
                    window.location.href = 'index.html';
                } else {
                    statusText.textContent = 'Logout failed.';
                }
            } catch (error) {
                console.error('Logout error:', error);
                statusText.textContent = 'Could not connect to the server.';
            }
        }

        loadProfile();
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
</head>
<body>
    <h1>Accounts page</h1>
    <p>Log in to your account to access games and other things</p>
    <p><a href="create-account.html">Create an account</a></p>

    <form id="login-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <input type="submit" value="Log In">
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <script>
        const loginForm = document.getElementById('login-form');
        const statusText = document.getElementById('status');

        async function loadCurrentUser() {
            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/me', {
                    credentials: 'include',
                    method: 'GET',
                });

                if (response.ok) {
                    const result = await response.json();
                    statusText.textContent = `Logged in as ${result.user.firstName || result.user.username}`;
                }
            } catch (error) {
                console.error('Could not load current user', error);
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitButton = loginForm.querySelector('[type="submit"]');

            statusText.textContent = 'Logging in...';
            submitButton.disabled = true;

            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    statusText.textContent = `Welcome, ${result.user.firstName || result.user.username}!`;
                    loginForm.reset();
                    await loadCurrentUser();
                    return;
                }

                statusText.textContent = result.error || 'Unable to log in.';
            } catch (error) {
                console.error('Login error:', error);
                statusText.textContent = 'Could not connect to the server. Please try again.';
            } finally {
                submitButton.disabled = false;
            }
        });

        loadCurrentUser();
    </script>
</body>
</html>

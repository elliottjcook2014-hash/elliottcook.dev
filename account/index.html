<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
</head>
<body>
    <h1>Account Login</h1>
    <p>Log in to your account to access games and other features.</p>
    
    <p id="create-account-link">
        Don't have an account? <a href="create-account.html">Create one here</a>
    </p>

    <form id="login-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <input type="submit" value="Log In">
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <button id="logout">Log Out</button>
    <script>
        const loginForm = document.getElementById('login-form');
        const statusText = document.getElementById('status');

        // Check if user is already logged in when visiting index.html
        async function checkAlreadyLoggedIn() {
            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/me', {
                    credentials: 'include',
                    method: 'GET',
                });

                if (response.ok) {
                    // Already logged in, redirect directly to profile page
                    window.location.href = 'account.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitButton = loginForm.querySelector('[type="submit"]');

            statusText.textContent = 'Logging in...';
            submitButton.disabled = true;

            try {
                const response = await fetch('https://api.elliottcook.dev/accounts/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    statusText.textContent = 'Login successful! Redirecting...';
                    // Redirect to the account view page after successful login
                    setTimeout(() => {
                        window.location.href = 'account.html';
                    }, 500);
                    return;
                }

                statusText.textContent = result.error || 'Unable to log in.';
            } catch (error) {
                console.error('Login error:', error);
                statusText.textContent = 'Could not connect to the server. Please try again.';
            } finally {
                submitButton.disabled = false;
            }
        });

        async function logout() {
          try {
            const response = await fetch('https://api.elliottcook.dev/accounts/logout', {
              method: 'POST',
              credentials: 'include' // Crucial: sends the session cookie to be cleared
            });

            if (response.ok) {
               // Redirect to the login page after successful logout
               window.location.href = '/account/index.html';
            } else {
              console.error('Logout failed on server');
            }
          } catch (error) {
            console.error('Network error during logout:', error);
          }
        }

        // Run session check on page load
        checkAlreadyLoggedIn();
    </script>
</body>
</html>
